name: flutter_architecture_samples
description: "A Flutter mobile app template — the smallest complete architecture."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # `bloc` is listed next to `flutter_bloc` on purpose: a bloc file imports only
  # this one, which is what makes "no Flutter inside a bloc" checkable by
  # reading its imports.
  bloc: ^9.1.0
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  get_it: ^9.2.1
  go_router: ^17.5.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
